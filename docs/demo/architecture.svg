<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6B62"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8B3AD"/>
    </marker>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#17201B" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#FAF9F5"/>

  <!-- ── header ── -->
  <text x="80" y="82" font-size="42" font-weight="800" fill="#17201B">HackMatch — Architecture</text>
  <text x="80" y="122" font-size="22" fill="#5A6B62">Ship It track · every box below is deployed and serving traffic</text>
  <line x1="80" y1="150" x2="1520" y2="150" stroke="#E3E6E1" stroke-width="2"/>

  <!-- ══ request path ══ -->
  <text x="80" y="212" font-size="17" font-weight="700" fill="#0F6B57" letter-spacing="1.6">THE REQUEST PATH</text>

  <!-- browser -->
  <g filter="url(#card)">
    <rect x="80" y="238" width="210" height="104" rx="14" fill="#FFFFFF" stroke="#E3E6E1" stroke-width="2"/>
  </g>
  <text x="185" y="284" font-size="23" font-weight="700" fill="#17201B" text-anchor="middle">Browser</text>
  <text x="185" y="312" font-size="17" fill="#5A6B62" text-anchor="middle">React SPA</text>

  <line x1="290" y1="290" x2="368" y2="290" stroke="#5A6B62" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- amplify -->
  <g filter="url(#card)">
    <rect x="376" y="238" width="232" height="104" rx="14" fill="#0F6B57"/>
  </g>
  <text x="492" y="278" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">AWS Amplify</text>
  <text x="492" y="304" font-size="16" fill="#CDE8E1" text-anchor="middle">hosting · CI/CD from</text>
  <text x="492" y="325" font-size="16" fill="#CDE8E1" text-anchor="middle">GitHub on every merge</text>

  <line x1="608" y1="290" x2="686" y2="290" stroke="#5A6B62" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- api gateway -->
  <g filter="url(#card)">
    <rect x="694" y="238" width="242" height="104" rx="14" fill="#0F6B57"/>
  </g>
  <text x="815" y="278" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">API Gateway</text>
  <text x="815" y="304" font-size="16" fill="#CDE8E1" text-anchor="middle">HTTP API · $default stage</text>
  <text x="815" y="325" font-size="16" fill="#CDE8E1" text-anchor="middle">throttled 100 rps</text>

  <line x1="936" y1="290" x2="1014" y2="290" stroke="#5A6B62" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- lambda -->
  <g filter="url(#card)">
    <rect x="1022" y="222" width="268" height="136" rx="14" fill="#0F6B57"/>
  </g>
  <text x="1156" y="266" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">AWS Lambda</text>
  <text x="1156" y="294" font-size="16" fill="#CDE8E1" text-anchor="middle">Express, wrapped with</text>
  <text x="1156" y="315" font-size="16" fill="#CDE8E1" text-anchor="middle">serverless-http</text>
  <text x="1156" y="340" font-size="15" fill="#9FD3C7" text-anchor="middle">arm64 · 512 MB</text>

  <!-- ══ data + ops ══ -->
  <text x="80" y="452" font-size="17" font-weight="700" fill="#0F6B57" letter-spacing="1.6">DATA AND OPERATIONS</text>

  <!-- dynamodb -->
  <g filter="url(#card)">
    <rect x="80" y="478" width="300" height="124" rx="14" fill="#FFFFFF" stroke="#0F6B57" stroke-width="2.5"/>
  </g>
  <text x="230" y="518" font-size="22" font-weight="700" fill="#17201B" text-anchor="middle">Amazon DynamoDB</text>
  <text x="230" y="546" font-size="16" fill="#5A6B62" text-anchor="middle">Users · Competitions · Teams</text>
  <text x="230" y="567" font-size="16" fill="#5A6B62" text-anchor="middle">JoinRequests · Invitations</text>
  <text x="230" y="590" font-size="15" font-weight="600" fill="#0F6B57" text-anchor="middle">PAY_PER_REQUEST — no idle cost</text>

  <!-- s3 -->
  <g filter="url(#card)">
    <rect x="410" y="478" width="300" height="124" rx="14" fill="#FFFFFF" stroke="#0F6B57" stroke-width="2.5"/>
  </g>
  <text x="560" y="518" font-size="22" font-weight="700" fill="#17201B" text-anchor="middle">Amazon S3</text>
  <text x="560" y="546" font-size="16" fill="#5A6B62" text-anchor="middle">competition briefs — private,</text>
  <text x="560" y="567" font-size="16" fill="#5A6B62" text-anchor="middle">public access blocked</text>
  <text x="560" y="590" font-size="15" font-weight="600" fill="#0F6B57" text-anchor="middle">presigned PUT — bypasses 6 MB limit</text>

  <!-- cloudwatch -->
  <g filter="url(#card)">
    <rect x="740" y="478" width="300" height="124" rx="14" fill="#FFFFFF" stroke="#0F6B57" stroke-width="2.5"/>
  </g>
  <text x="890" y="518" font-size="22" font-weight="700" fill="#17201B" text-anchor="middle">Amazon CloudWatch</text>
  <text x="890" y="546" font-size="16" fill="#5A6B62" text-anchor="middle">dashboard · 3 alarms</text>
  <text x="890" y="567" font-size="16" fill="#5A6B62" text-anchor="middle">structured JSON access logs</text>
  <text x="890" y="590" font-size="15" font-weight="600" fill="#0F6B57" text-anchor="middle">5xx · Lambda errors · p99 &gt; 3s</text>

  <!-- iam -->
  <g filter="url(#card)">
    <rect x="1070" y="478" width="220" height="124" rx="14" fill="#FFFFFF" stroke="#0F6B57" stroke-width="2.5"/>
  </g>
  <text x="1180" y="518" font-size="22" font-weight="700" fill="#17201B" text-anchor="middle">AWS IAM</text>
  <text x="1180" y="546" font-size="16" fill="#5A6B62" text-anchor="middle">least privilege,</text>
  <text x="1180" y="567" font-size="16" fill="#5A6B62" text-anchor="middle">per table and prefix</text>
  <text x="1180" y="590" font-size="15" font-weight="600" fill="#0F6B57" text-anchor="middle">no wildcard grants</text>

  <!-- lambda -> the four -->
  <path d="M 1100 358 L 1100 420 L 230 420 L 230 478" fill="none" stroke="#5A6B62" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1130 358 L 1130 432 L 560 432 L 560 478" fill="none" stroke="#5A6B62" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1170 358 L 1170 444 L 890 444 L 890 478" fill="none" stroke="#5A6B62" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1210 358 L 1210 456 L 1180 456 L 1180 478" fill="none" stroke="#5A6B62" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ══ built, not in the live path ══ -->
  <text x="80" y="700" font-size="17" font-weight="700" fill="#8A968F" letter-spacing="1.6">INTEGRATED AND TESTED — NOT IN THE LIVE PATH</text>

  <g>
    <rect x="80" y="726" width="300" height="100" rx="14" fill="#F2F4F1" stroke="#C3CCC6" stroke-width="2" stroke-dasharray="7 5"/>
  </g>
  <text x="230" y="764" font-size="21" font-weight="700" fill="#5A6B62" text-anchor="middle">Amazon Cognito</text>
  <text x="230" y="790" font-size="15.5" fill="#7A867F" text-anchor="middle">user pool provisioned, ID tokens</text>
  <text x="230" y="810" font-size="15.5" fill="#7A867F" text-anchor="middle">verified — local JWT still live</text>

  <g>
    <rect x="410" y="726" width="300" height="100" rx="14" fill="#F2F4F1" stroke="#C3CCC6" stroke-width="2" stroke-dasharray="7 5"/>
  </g>
  <text x="560" y="764" font-size="21" font-weight="700" fill="#5A6B62" text-anchor="middle">Amazon Bedrock</text>
  <text x="560" y="790" font-size="15.5" fill="#7A867F" text-anchor="middle">Converse API integrated; account</text>
  <text x="560" y="810" font-size="15.5" fill="#7A867F" text-anchor="middle">not entitled to invoke models</text>

  <path d="M 1060 776 L 730 776" fill="none" stroke="#A8B3AD" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowMuted)"/>

  <!-- extraction adapter callout -->
  <g filter="url(#card)">
    <rect x="740" y="726" width="550" height="100" rx="14" fill="#FEF7D6" stroke="#F4D35E" stroke-width="2.5"/>
  </g>
  <text x="768" y="760" font-size="20" font-weight="700" fill="#17201B">Extraction adapter — one interface, three providers</text>
  <text x="768" y="788" font-size="16" fill="#6B5A17">EXTRACTION_PROVIDER = rules (live) | comprehend | bedrock</text>
  <text x="768" y="810" font-size="15" fill="#8A7420">Identical validated output. Any provider falls back to rules on error.</text>

  <!-- footer -->
  <text x="80" y="872" font-size="17" fill="#5A6B62">
    All infrastructure as code — one AWS SAM template. 108 automated tests.
  </text>
  <text x="1520" y="872" font-size="17" font-weight="600" fill="#0F6B57" text-anchor="end">AI recommends. Humans decide.</text>
</svg>
